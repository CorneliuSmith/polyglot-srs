name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported floor (code uses datetime.UTC); 3.12 is the
        # upper end of the range camel-tools supports.
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polyglot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Drives the real-Postgres integration/RLS tests (skipped if unset).
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polyglot_test
      # Drives the real-Redis rate-limiter tests (skipped if unset).
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Lean test subset — heavy NLP backends (spaCy, camel-tools) degrade
          # gracefully and their tests skip, so they aren't needed in CI.
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings \
            asyncpg PyJWT cryptography httpx python-multipart anthropic redis \
            pymorphy3 cyrtranslit \
            lemminflect nltk numpy scipy stripe sentry-sdk ruff pytest pytest-asyncio cffi
      # The English seeder's definitions come from WordNet, which is data and
      # not a package. Cached, because this is the suite's only network
      # dependency and nltk's data host is the least reliable thing in the
      # build: three jobs in one pull request failed here, on a docs-only
      # diff, and each looked like thirteen broken tests. Retried, because a
      # single `nltk.downloader` call exits 0 even when it fetched nothing.
      # Not fatal, because the tests that need it skip when it's absent
      # (backend/tests/conftest.py) rather than fail as though the seeder
      # broke.
      - name: Cache NLTK data
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: nltk-wordnet-omw-1.4-v1
      - name: Download NLTK WordNet (English seeder)
        run: |
          for attempt in 1 2 3; do
            if python -c "import nltk; nltk.data.find('corpora/wordnet')" 2>/dev/null; then
              echo "WordNet present."
              exit 0
            fi
            echo "WordNet missing — download attempt $attempt…"
            python -m nltk.downloader -q wordnet omw-1.4 || true
            sleep $((attempt * 5))
          done
          python -c "import nltk; nltk.data.find('corpora/wordnet')" 2>/dev/null \
            && echo "WordNet present." \
            || echo "::warning::WordNet unavailable — English seeder tests will skip."
      - name: Ruff
        run: ruff check backend
      - name: Pytest (unit + integration/RLS)
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build (tsc -b + vite build)
        # The static site deploys this exact build. Running it in CI catches
        # a broken production build before it fails on the platform (a build
        # break otherwise slips past a tests-only check and the old bundle
        # keeps serving).
        run: npm run build
